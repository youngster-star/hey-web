server:
  port: 8080

spring:
  application:
    name: hey-web

  datasource:
    url: jdbc:mysql://localhost:3306/hey_web?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT
jwt:
  secret: ${JWT_SECRET:heyqing-jwt-secret-key-change-in-production}
  access-token-expiration: 3600000    # 1 hour (ms)
  refresh-token-expiration: 604800000  # 7 days (ms)

# SpringDoc (Knife4j)
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs
  packages-to-scan: top.heyqing.heyweb.controller

# Logging
logging:
  level:
    root: INFO
    top.heyqing.heyweb: DEBUG
