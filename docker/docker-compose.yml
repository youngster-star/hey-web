services:
  mysql:
    image: mysql:8.0
    container_name: hey-web-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: hey_web
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hey-web-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ../hey-web-backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: hey-web-backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-heyqing-jwt-secret-change-in-production}
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ../hey-web-frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: hey-web-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
